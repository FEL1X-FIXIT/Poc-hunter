name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libjpeg-turbo-dev zlib1g-dev
          pip install --upgrade pip cython==0.29.36 buildozer kivy
      
      - name: Build APK
        run: buildozer android debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/pochunter-*.apk
