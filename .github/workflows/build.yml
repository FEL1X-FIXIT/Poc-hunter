name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            python3-dev \
            libffi-dev \
            libssl-dev
      
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython
      
      - name: Setup Android SDK/NDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          yes | cmdline-tools/bin/sdkmanager --sdk_root=. \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;25.1.8937393" || true
      
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
          buildozer android debug -v 2>&1 | tail -100 | tee build_output.txt
          
      - name: Check results
        if: always()
        run: |
          echo "=== Checking for APK ===" 
          find ~/.buildozer -name "*.apk" 2>/dev/null | head
          ls -la bin/ 2>/dev/null || echo "No bin dir"
          if [ -f build_output.txt ]; then
            echo ""
            echo "=== Build output (last lines) ==="
            tail -30 build_output.txt
          fi
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pochunter-apk
          path: bin/*.apk
          if-no-files-found: warn