name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip wget python3-dev libffi-dev libssl-dev ant
      
      - name: Install Python tools
        run: pip install --quiet buildozer cython
      
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          cd $HOME/.buildozer/android/platform/android-sdk
          
          # Download and extract cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          # Create the proper directory structure for cmdline-tools
          mkdir -p cmdline-tools/latest
          cp -r cmdline-tools/* .
          rm -rf cmdline-tools
          mkdir -p cmdline-tools/latest
          mv bin tools .android NOTICE.txt LICENSE.txt cmdline-tools/latest/ 2>/dev/null || true
          
          # Install SDK packages
          export SDKMANAGER=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
            "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.1.8937393" >/dev/null 2>&1 || true
          
          echo "SDK setup complete"
          ls -la $HOME/.buildozer/android/platform/android-sdk/ | head -10
      
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          echo "Building with buildozer..."
          buildozer android debug --no-strip 2>&1 | tee build.log
          
          BUILD_EXIT=$?
          echo "Build exit code: $BUILD_EXIT"
      
      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find $HOME/.buildozer -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== Last 80 lines of build log ==="
          tail -80 build.log || true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pochunter-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: ignore