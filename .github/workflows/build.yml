name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      
      - name: Install system dependencies  
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip wget python3-dev libffi-dev libssl-dev ant cython
      
      - name: Install buildozer
        run: pip install buildozer
      
      - name: Configure buildozer
        run: |
          # Pre-create buildozer cache to avoid permission issues
          mkdir -p ~/.buildozer
          
      - name: Diagnose buildozer
        run: |
          which buildozer
          buildozer --help | head -20
          buildozer --version
      
      - name: Build APK - VERBOSE
        run: |
          export BUILDOZER_LOG_LEVEL=2
          buildozer -v android debug 2>&1 | tee full_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          
      - name: Show full log on failure
        if: always()
        run: |
          echo "=== FULL BUILD LOG (last 150 lines) ==="
          tail -150 full_build.log || echo "No log file"
      
      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APKs..."
          find . -name "*.apk" 2>/dev/null || echo "No APKs found"
          
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: full_build.log
          if-no-files-found: ignore