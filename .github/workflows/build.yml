name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: madlord/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        run: |
          cd /root
          cp -r /github/workspace/* .
          buildozer android debug 2>&1 | tail -50
          
      - name: Copy APK
        run: cp -v /root/bin/*.apk /github/workspace/bin/ 2>/dev/null || echo "APK not found"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pochunter-apk
          path: bin/*.apk