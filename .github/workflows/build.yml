name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip wget python3-dev libffi-dev libssl-dev ant
      
      - name: Install build tools
        run: pip install --quiet buildozer cython
      
      - name: Setup Android
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          cd android-sdk && yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root=. \
            "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.1.8937393" >/dev/null 2>&1 || true
      
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          echo "Starting buildozer..."
          buildozer android debug --no-strip 2>&1 | tee build.log || echo "Buildozer exited with: $?"
          
          echo ""
          echo "=== Checking for APK ==="
          find ~/.buildozer -name "*.apk" -ls 2>/dev/null | head -20
          find . -name "*.apk" -ls 2>/dev/null
          
          echo ""
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log
          
          echo ""
          echo "=== Listing bin directory ==="
          ls -lah bin/ || echo "No bin directory"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pochunter-apk
          path: bin/*.apk
          if-no-files-found: ignore