name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install all dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip openjdk-11-jdk-headless android-sdk build-essential git zip unzip wget cython3
          pip3 install buildozer
      
      - name: Build
        run: |
          buildozer android debug 2>&1 | tail -100
          ls -la bin/ || echo "No bin dir"
          find / -name "*.apk" 2>/dev/null | head -5
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn