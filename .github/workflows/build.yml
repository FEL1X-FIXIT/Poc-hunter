name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: f0rmiga/buildozer:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo "Build exit: $?"
      
      - name: Check output
        if: always()
        run: |
          ls -la bin/ || true
          find . -name "*.apk" || true
          echo "--- Last 100 lines of log ---"
          tail -100 build.log || true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pochunter-apk
          path: bin/*.apk
          if-no-files-found: warn