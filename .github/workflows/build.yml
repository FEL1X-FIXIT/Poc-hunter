name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - run: |
          pip install --upgrade pip cython buildozer kivy
          buildozer android debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/pochunter-*.apk
