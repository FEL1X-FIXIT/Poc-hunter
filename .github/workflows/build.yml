name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk
      
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            libpng-dev \
            libgeos-dev \
            libgeos++-dev \
            wget \
            git \
            zip \
            unzip
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython buildozer kivy requests urllib3
      
      - name: Setup Android SDK and NDK
        run: |
          mkdir -p ~/.android
          echo "sdk.dir=$HOME/.android/sdk" > ~/.android/local.properties
          
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          
          # Download Android SDK command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          
          # Accept licenses and install SDK tools
          cd android-sdk
          mkdir -p cmdline-tools/latest/bin
          echo "y" | cmdline-tools/latest/bin/sdkmanager --sdk_root=. "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.1.8937393" 2>/dev/null || echo "SDK install warning, continuing..."
      
      - name: Build APK with Buildozer
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
          buildozer android debug 2>&1 | tee build.log
          
      - name: Check build output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "=== Build Log (last 100 lines) ===" 
            tail -100 build.log
          fi
          ls -la bin/ 2>/dev/null || echo "No bin directory"
      
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/pochunter-*.apk
          retention-days: 30